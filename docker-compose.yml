services:
  db:
    image: mysql:8.0
    container_name: headless-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secure
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_db_user
      MYSQL_PASSWORD: wp_db_password_secure
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - monorepo-network

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: headless-wordpress-cms
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_db_user
      WORDPRESS_DB_PASSWORD: wp_db_password_secure
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - wp_data:/var/www/html
    networks:
      - monorepo-network

volumes:
  mysql_data:
  wp_data:

networks:
  monorepo-network:
    driver: bridge
