services:
  # 1. Persistent Database Store for Headless Core
  db:
    image: mysql:8.0
    container_name: headless-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_secure
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_db_user
      MYSQL_PASSWORD: wp_db_password_secure
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - monorepo-network

  # 2. Headless WordPress CMS (Isolated Content Layer)
  wordpress:
    image: wordpress:latest
    container_name: headless-wordpress-cms
    restart: always
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_db_user
      WORDPRESS_DB_PASSWORD: wp_db_password_secure
      WORDPRESS_DB_NAME: wordpress_db
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - db
    networks:
      - monorepo-network

  # 3. API Middleman (Simulating stateless AWS Lambda / Gateway Gateway Layer)
  api-lambda-middleman:
    image: node:20-alpine
    container_name: api-lambda-middleman
    working_dir: /usr/src/app
    ports:
      - "3001:3001"
    volumes:
      - .:/usr/src/app
    command: npm run dev --workspace=apps/api-lambda-middleman
    environment:
      - PORT=3001
      - WORDPRESS_API_URL=http://headless-wordpress-cms/wp-json
    depends_on:
      - wordpress
    networks:
      - monorepo-network

  # 4. Vite React Client Application
  client-react:
    image: node:20-alpine
    container_name: client-react
    working_dir: /usr/src/app
    ports:
      - "5173:5173"
    volumes:
      - .:/usr/src/app
    command: npm run dev --workspace=apps/client-react
    depends_on:
      - api-lambda-middleman
    networks:
      - monorepo-network

volumes:
  mysql_data:
  wp_data:

networks:
  monorepo-network:
    driver: bridge
